services:
  api:
    build: .
    container_name: digital-notary-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: digital-notary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_notary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: digital-notary-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: