apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-notary-api
  namespace: digital-notary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-notary-api
  template:
    metadata:
      labels:
        app: digital-notary-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/digital-notary-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: digital-notary-config
            - secretRef:
                name: digital-notary-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: digital-notary-api
  namespace: digital-notary
spec:
  selector:
    app: digital-notary-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
