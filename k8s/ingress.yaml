apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-notary-api
  namespace: digital-notary
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: digital-notary.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digital-notary-api
                port:
                  number: 80
